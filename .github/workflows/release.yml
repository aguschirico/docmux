name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --target wasm32-unknown-unknown -p docmux-wasm

  publish-npm:
    name: Publish to npm
    needs: validate
    runs-on: ubuntu-latest
    # Trusted publishing: npm checks this workflow's OIDC identity, so no
    # token is stored. Configured on npmjs.com for aguschirico/docmux and
    # release.yml, allowed to stage only: each version waits for a
    # maintainer to approve it with 2FA (npmjs.com or `npm stage approve`).
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm 11.5.1 or later (Node 24 ships npm 11).
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build WASM + TS wrapper
        run: pnpm --filter @docmux/wasm run build

      - name: Update npm for staged publishing
        run: npm install -g npm@^11.15 && npm --version

      - name: Stage on npm
        run: npm stage publish --access public
        working-directory: npm
