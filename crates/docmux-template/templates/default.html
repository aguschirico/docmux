<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
$if(title)$<title>$title$</title>
$endif$$if(math)$$math$
$endif$$for(css)$<link rel="stylesheet" href="$css$">
$endfor$$if(highlighting-css)$<style>
$highlighting-css$
</style>
$endif$</head>
<body>
$if(title)$<header id="title-block-header">
<h1 class="title">$title$</h1>
$for(author)$<p class="author">$author.name$</p>
$endfor$$if(date)$<p class="date">$date$</p>
$endif$</header>
$endif$$if(abstract)$<section class="abstract">
<h2 class="abstract-title">Abstract</h2>
$abstract$</section>
$endif$$body$</body>
</html>
